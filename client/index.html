<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2e7d32">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <title>🌿 BroLife</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg: #e8f5e9;
            --app-bg: #fff;
            --header-bg: linear-gradient(135deg, #2e7d32, #43a047);
            --text: #1b5e20;
            --text-secondary: #81c784;
            --input-bg: #f1f8e9;
            --input-border: #c8e6c9;
            --msg-other-bg: #f1f8e9;
            --msg-other-text: #1b5e20;
            --msg-mine-bg: linear-gradient(135deg, #66bb6a, #43a047);
            --msg-mine-text: #fff;
            --online: #32d74b;
            --danger: #e53935;
        }
        
        .dark {
            --bg: #0a0a0a;
            --app-bg: #121212;
            --header-bg: linear-gradient(135deg, #1a3a1a, #2e7d32);
            --text: #e8f5e9;
            --text-secondary: #66bb6a;
            --input-bg: #1c1c1e;
            --input-border: #2c2c2e;
            --msg-other-bg: #1c1c1e;
            --msg-other-text: #e8f5e9;
            --msg-mine-bg: linear-gradient(135deg, #2e7d32, #1b5e20);
            --msg-mine-text: #fff;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            -webkit-tap-highlight-color: transparent;
        }
        
        #app {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            height: 100dvh;
            max-height: 100dvh;
            background: var(--app-bg);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        
        @media (min-width: 450px) {
            #app {
                height: 90vh;
                height: 90dvh;
                max-height: 800px;
                border-radius: 24px;
                box-shadow: 0 0 40px rgba(0,0,0,0.08);
            }
            body {
                padding: 20px;
            }
        }
        
        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--app-bg);
        }
        
        .hidden {
            display: none !important;
        }
        
        .header {
            background: var(--header-bg);
            padding: 12px 16px;
            padding-top: max(12px, env(safe-area-inset-top));
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 56px;
            z-index: 10;
        }
        
        .header-btn {
            background: none;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
            padding: 8px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }
        
        .header-btn:active {
            background: rgba(255,255,255,0.2);
        }
        
        .header-title {
            font-size: 18px;
            font-weight: 600;
            flex: 1;
        }
        
        .avatar-sm {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .avatar-sm:active {
            transform: scale(0.9);
        }
        
        .avatar-sm img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .avatar-md {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #c8e6c9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
        }
        
        .avatar-md img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--online);
            border: 2px solid var(--app-bg);
        }
        
        .group-avatar {
            background: linear-gradient(135deg, #81c784, #4caf50);
            color: white;
            font-weight: bold;
            font-size: 20px;
        }
        
        /* AUTH */
        .auth-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: linear-gradient(180deg, #2e7d32 0%, #1b5e20 40%, #e8f5e9 100%);
            overflow-y: auto;
        }
        
        .auth-logo {
            font-size: 80px;
            margin-bottom: 40px;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .auth-card {
            background: var(--app-bg);
            border-radius: 24px;
            padding: 30px 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .auth-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            text-align: center;
            margin-bottom: 8px;
        }
        
        .auth-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 24px;
        }
        
        .auth-input {
            width: 100%;
            padding: 16px 18px;
            border: 2px solid var(--input-border);
            border-radius: 16px;
            font-size: 17px;
            margin-bottom: 16px;
            background: var(--input-bg);
            color: var(--text);
            outline: none;
            transition: 0.2s;
            -webkit-appearance: none;
        }
        
        .auth-input:focus {
            border-color: #4caf50;
            box-shadow: 0 0 0 4px rgba(76,175,80,0.1);
        }
        
        .auth-input::placeholder {
            color: #aaa;
        }
        
        .auth-input.phone {
            text-align: center;
            letter-spacing: 1px;
            font-size: 22px;
        }
        
        .auth-input.code {
            text-align: center;
            letter-spacing: 8px;
            font-size: 28px;
            font-weight: 700;
        }
        
        .auth-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #43a047, #2e7d32);
            color: white;
            box-shadow: 0 4px 16px rgba(46,125,50,0.3);
        }
        
        .btn-primary:active {
            transform: scale(0.97);
            opacity: 0.9;
        }
        
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-outline {
            background: transparent;
            color: #2e7d32;
            border: 2px solid var(--input-border);
            margin-top: 12px;
        }
        
        .auth-error {
            color: var(--danger);
            font-size: 13px;
            text-align: center;
            min-height: 20px;
            margin-bottom: 4px;
        }
        
        .auth-timer {
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 12px;
        }
        
        /* CHAT LIST */
        .chat-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--input-border);
            transition: background 0.1s;
        }
        
        .chat-item:active {
            background: var(--input-bg);
        }
        
        .chat-info {
            flex: 1;
            min-width: 0;
        }
        
        .chat-name {
            font-weight: 600;
            color: var(--text);
            font-size: 15px;
        }
        
        .chat-last {
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .chat-time {
            font-size: 11px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        
        .empty-chats {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            font-size: 15px;
        }
        
        .empty-chats .emoji {
            font-size: 60px;
            display: block;
            margin-bottom: 16px;
        }
        
        .fab {
            position: absolute;
            bottom: 24px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #66bb6a, #43a047);
            color: white;
            font-size: 28px;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(46,125,50,0.4);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        
        .fab:active {
            transform: scale(0.9);
        }
        
        /* CONTACTS */
        .search-bar {
            padding: 10px 16px;
            background: var(--app-bg);
            border-bottom: 1px solid var(--input-border);
        }
        
        .search-bar input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--input-border);
            border-radius: 24px;
            font-size: 15px;
            outline: none;
            background: var(--input-bg);
            color: var(--text);
            -webkit-appearance: none;
        }
        
        .search-bar input:focus {
            border-color: #66bb6a;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--input-border);
        }
        
        .contact-item:active {
            background: var(--input-bg);
        }
        
        .contact-name {
            font-weight: 500;
            color: var(--text);
            font-size: 15px;
        }
        
        .contact-phone {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .no-contacts {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        
        /* MESSAGES */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: var(--input-bg);
            -webkit-overflow-scrolling: touch;
        }
        
        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: msgIn 0.2s ease;
        }
        
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message-wrapper.mine {
            align-self: flex-end;
        }
        
        .message-wrapper.other {
            align-self: flex-start;
        }
        
        .message-bubble {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.4;
            word-break: break-word;
            cursor: pointer;
            -webkit-user-select: text;
            user-select: text;
        }
        
        .message-wrapper.other .message-bubble {
            background: var(--msg-other-bg);
            color: var(--msg-other-text);
            border-bottom-left-radius: 6px;
        }
        
        .message-wrapper.mine .message-bubble {
            background: var(--msg-mine-bg);
            color: var(--msg-mine-text);
            border-bottom-right-radius: 6px;
        }
        
        .message-bubble img {
            max-width: 200px;
            border-radius: 12px;
            display: block;
        }
        
        .message-bubble audio {
            max-width: 200px;
            height: 40px;
        }
        
        .message-time {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 3px;
            padding: 0 4px;
        }
        
        .message-wrapper.mine .message-time {
            text-align: right;
        }
        
        .message-sender {
            font-size: 12px;
            color: #43a047;
            margin-bottom: 2px;
            font-weight: 600;
            padding: 0 4px;
        }
        
        .system-msg {
            text-align: center;
            color: var(--text-secondary);
            font-size: 12px;
            padding: 8px;
            font-style: italic;
        }
        
        .typing-indicator {
            color: var(--text-secondary);
            font-size: 12px;
            padding: 4px 16px;
            font-style: italic;
        }
        
        /* INPUT */
        .input-area {
            display: flex;
            gap: 8px;
            padding: 10px 14px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            border-top: 1px solid var(--input-border);
            background: var(--app-bg);
            align-items: center;
        }
        
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--input-border);
            border-radius: 24px;
            font-size: 15px;
            outline: none;
            background: var(--input-bg);
            color: var(--text);
            -webkit-appearance: none;
        }
        
        .input-area input:focus {
            border-color: #66bb6a;
        }
        
        .attach-btn,
        .voice-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: background 0.2s;
        }
        
        .attach-btn:active,
        .voice-btn:active {
            background: var(--input-border);
        }
        
        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #66bb6a, #43a047);
            color: white;
            font-size: 18px;
            border: none;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.2s;
        }
        
        .send-btn:active {
            transform: scale(0.9);
        }
        
        /* PROFILE */
        .profile-container {
            flex: 1;
            overflow-y: auto;
            background: var(--bg);
            -webkit-overflow-scrolling: touch;
        }
        
        .profile-cover {
            width: 100%;
            height: 160px;
            background: linear-gradient(135deg, #2e7d32, #66bb6a);
        }
        
        .profile-header-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: -65px;
            padding: 0 20px 30px;
        }
        
        .profile-avatar-big {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: #c8e6c9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 65px;
            border: 4px solid #fff;
            box-shadow: 0 4px 24px rgba(0,0,0,0.2);
            overflow: hidden;
            position: relative;
        }
        
        .profile-avatar-big img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .profile-name {
            font-size: 24px;
            color: var(--text);
            font-weight: 700;
            margin-top: 16px;
        }
        
        .profile-username {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        
        .profile-phone {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        
        .profile-bio {
            font-size: 14px;
            color: var(--text-secondary);
            text-align: center;
            padding: 0 30px;
            margin-top: 12px;
            line-height: 1.5;
        }
        
        .profile-actions {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        
        .profile-action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text);
            transition: transform 0.2s;
        }
        
        .profile-action-btn:active {
            transform: scale(0.9);
        }
        
        .profile-action-circle {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--app-bg);
            border: 2px solid var(--input-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }
        
        .profile-action-circle.primary {
            background: #43a047;
            border: none;
            color: white;
            width: 60px;
            height: 60px;
            font-size: 24px;
        }
        
        .profile-action-label {
            font-size: 11px;
            color: var(--text-secondary);
        }
        
        .profile-info-card {
            background: var(--app-bg);
            border: 1px solid var(--input-border);
            border-radius: 16px;
            padding: 4px 16px;
            width: 100%;
            margin-top: 8px;
        }
        
        .profile-info-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid var(--input-border);
            color: var(--text);
            font-size: 14px;
        }
        
        .profile-info-row:last-child {
            border-bottom: none;
        }
        
        .profile-info-icon {
            font-size: 18px;
            width: 28px;
            text-align: center;
            flex-shrink: 0;
        }
        
        /* SETTINGS */
        .settings-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            background: var(--bg);
            gap: 10px;
            overflow-y: auto;
        }
        
        .settings-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--app-bg);
            border-radius: 16px;
            color: var(--text);
            font-size: 15px;
        }
        
        .settings-btn {
            width: 100%;
            padding: 16px 20px;
            background: var(--app-bg);
            border: none;
            border-radius: 16px;
            color: var(--text);
            font-size: 15px;
            cursor: pointer;
            text-align: left;
            font-weight: 500;
            transition: background 0.1s;
        }
        
        .settings-btn:active {
            background: var(--input-bg);
        }
        
        .settings-btn.danger {
            color: var(--danger);
        }
        
        .toggle {
            position: relative;
            display: inline-block;
            width: 52px;
            height: 28px;
        }
        
        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #ccc;
            transition: .3s;
            border-radius: 28px;
        }
        
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background: white;
            transition: .3s;
            border-radius: 50%;
        }
        
        input:checked + .toggle-slider {
            background: #43a047;
        }
        
        input:checked + .toggle-slider:before {
            transform: translateX(24px);
        }
        
        ::-webkit-scrollbar {
            width: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--input-border);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const API = 'http://localhost:5000';
        
        let currentUser = null;
        let currentChat = null;
        let socket = null;
        let allUsersCache = [];
        let viewingProfile = null;
        let unsubscribeChat = null;
        let verifiedEmail = '';
        
        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }
        
        function formatTime(date) {
            if (!date) return '';
            var d = new Date(date);
            return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        }
        
        function timeAgo(date) {
            if (!date) return '';
            var d = new Date(date);
            var diff = Math.floor((Date.now() - d.getTime()) / 60000);
            if (diff < 1) return 'только что';
            if (diff < 60) return diff + ' мин';
            var h = Math.floor(diff / 60);
            if (h < 24) return h + ' ч';
            var days = Math.floor(h / 24);
            if (days === 1) return 'вчера';
            if (days < 7) return days + ' дн';
            return d.toLocaleDateString('ru-RU');
        }
        
        function switchScreen(name) {
            var screens = ['authScreen', 'chatListScreen', 'contactsScreen', 'chatScreen', 'profileScreen', 'settingsScreen', 'createGroupScreen'];
            screens.forEach(function(id) {
                var el = document.getElementById(id);
                if (el) el.classList.add('hidden');
            });
            
            var map = {
                'auth': 'authScreen',
                'chatList': 'chatListScreen',
                'contacts': 'contactsScreen',
                'chat': 'chatScreen',
                'profile': 'profileScreen',
                'settings': 'settingsScreen',
                'createGroup': 'createGroupScreen'
            };
            
            if (map[name]) {
                var el = document.getElementById(map[name]);
                if (el) el.classList.remove('hidden');
            }
        }
        
        // ============ AUTH ============
        function showAuthScreen() {
            var app = document.getElementById('app');
            app.innerHTML = `
                <div id="authScreen" class="screen">
                    <div class="auth-container">
                        <div class="auth-logo">🌿</div>
                        <div class="auth-card">

            });

            document.getElementById('backToEmailBtn').addEventListener('click', function() {
                document.getElementById('codeBlock').classList.add('hidden');
                document.getElementById('emailBlock').classList.remove('hidden');
            });

            document.getElementById('loginBtn').addEventListener('click', loginUser);

        async function sendCode() {
            var email = document.getElementById('emailInput').value.trim();
            var errEl = document.getElementById('emailError');
            
            if (!email || !email.includes('@')) {
                errEl.textContent = 'Введите корректный email';
                return;
            }
            
            verifiedEmail = email;
            var btn = document.getElementById('sendCodeBtn');
            btn.disabled = true;
            btn.textContent = 'Отправка...';
            errEl.textContent = '';
            
            try {
                var res = await fetch(API + '/api/auth/sendCode', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                var data = await res.json();
                
                if (data.success) {
                    document.getElementById('emailBlock').classList.add('hidden');
                    document.getElementById('codeBlock').classList.remove('hidden');
                    document.getElementById('authSubtitle').textContent = 'Код отправлен на ' + email;
                    document.getElementById('codeInput').focus();
                } else {
                    errEl.textContent = data.error;
                }
                
                btn.disabled = false;
                btn.textContent = 'Получить код';
            } catch (e) {
                btn.disabled = false;
                btn.textContent = 'Получить код';
                errEl.textContent = 'Сервер не отвечает';
            }
        }
        
        async function verifyCode() {
            var code = document.getElementById('codeInput').value.trim();
            var errEl = document.getElementById('codeError');
            
            if (!code || code.length < 6) {
                errEl.textContent = 'Введите 6-значный код из письма';
                return;
            }
            
            try {
                var res = await fetch(API + '/api/auth/verifyCode', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: verifiedEmail, code: code })
                });
                var data = await res.json();
                
                if (data.success) {
                    if (data.isNewUser) {
                        document.getElementById('codeBlock').classList.add('hidden');
                        document.getElementById('registerBlock').classList.remove('hidden');
                        document.getElementById('authSubtitle').textContent = 'Создайте профиль';
                    } else {
                        doLogin(data.user);
                    }
                } else {
                    errEl.textContent = data.error;
                }
            } catch (e) {
                errEl.textContent = 'Ошибка сервера';
            }
        }
        
        async function registerUser() {
            var username = document.getElementById('regUsername').value.trim();
            var password = document.getElementById('regPassword').value.trim();
            var displayName = document.getElementById('regDisplayName').value.trim() || username;
            var phone = document.getElementById('regPhone').value.trim();
            var errEl = document.getElementById('regError');
            
            if (!username || username.length < 3) {
                errEl.textContent = 'Логин минимум 3 символа';
                return;
            }
            if (!password || password.length < 3) {
                errEl.textContent = 'Пароль минимум 3 символа';
                return;
            }
            
            try {
                var res = await fetch(API + '/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        displayName: displayName,
                        email: verifiedEmail,
                        phone: phone
                    })
                });
                var data = await res.json();
                
                if (data.success) {
                    doLogin(data.user);
                } else {
                    errEl.textContent = data.error;
                }
            } catch (e) {
                errEl.textContent = 'Ошибка сервера';
            }
        }
        
        async function loginUser() {
            var username = document.getElementById('loginUsername').value.trim();
            var password = document.getElementById('loginPassword').value.trim();
            var errEl = document.getElementById('loginError');
            
            if (!username || !password) {
                errEl.textContent = 'Заполните все поля';
                return;
            }
            
            try {
                var res = await fetch(API + '/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                });
                var data = await res.json();
                
                if (data.success) {
                    doLogin(data.user);
                } else {
                    errEl.textContent = data.error;
                }
            } catch (e) {
                errEl.textContent = 'Сервер не отвечает';
            }
        }
        
        function doLogin(user) {
            currentUser = user;
            localStorage.setItem('brolife_user', JSON.stringify(user));
            connectSocket();
            showChatListScreen();
            loadChats();
        }
        
        // ============ SOCKET ============
        function connectSocket() {
            if (socket) socket.disconnect();
            socket = io(API);
            
            socket.on('connect', function() {
                socket.emit('authenticate', currentUser.id);
            });
            
            socket.on('newMessage', function(msg) {
                if (currentChat && msg.chatId === currentChat.id && msg.senderId !== currentUser.id) {
                    addMessageBubble(msg);
                }
                if (document.getElementById('chatListContainer')) {
                    loadChats();
                }
            });
            
            socket.on('chatUpdated', function() {
                if (document.getElementById('chatListContainer')) {
                    loadChats();
                }
            });
            
            socket.on('userStatus', function() {
                if (document.getElementById('chatListContainer')) {
                    loadChats();
                }
            });
        }
        
        // ============ CHAT LIST ============
        function showChatListScreen() {
            var app = document.getElementById('app');
            app.innerHTML = `
                <div id="chatListScreen" class="screen">
                    <div class="header">
                        <div class="avatar-sm" id="myAvatar">${currentUser.avatar ? '<img src="' + currentUser.avatar + '">' : '🌿'}</div>
                        <div class="header-title">🌿 BroLife</div>
                        <button class="header-btn" id="settingsBtn">⚙️</button>
                    </div>
                    <div class="chat-list" id="chatListContainer">
                        <div class="empty-chats"><span class="emoji">🌿</span>Нет чатов<br>Нажмите + чтобы начать</div>
                    </div>
                    <button class="fab" id="newChatBtn">+</button>
                </div>
            `;
            
            document.getElementById('myAvatar').addEventListener('click', function() {
                viewingProfile = currentUser;
                showProfileScreen();
            });
            document.getElementById('settingsBtn').addEventListener('click', showSettingsScreen);
            document.getElementById('newChatBtn').addEventListener('click', showContactsScreen);
        }
        
        function loadChats() {
            var container = document.getElementById('chatListContainer');
            if (!container) return;
            
            fetch(API + '/api/chats/' + currentUser.id)
                .then(function(res) { return res.json(); })
                .then(function(chats) {
                    container.innerHTML = '';
                    
                    if (!chats.length) {
                        container.innerHTML = '<div class="empty-chats"><span class="emoji">🌿</span>Нет чатов</div>';
                        return;
                    }
                    
                    chats.forEach(function(chat) {
                        var div = document.createElement('div');
                        div.className = 'chat-item';
                        
                        var time = chat.updatedAt ? formatTime(chat.updatedAt) : '';
                        var name = '';
                        var avatar = '';
                        
                        if (chat.type === 'group') {
                            avatar = '<div class="avatar-md group-avatar">' + (chat.groupName || 'Г')[0] + '</div>';
                            name = chat.groupName || 'Группа';
                        } else if (chat.otherUser) {
                            avatar = '<div class="avatar-md">' + (chat.otherUser.avatar ? '<img src="' + chat.otherUser.avatar + '">' : '🌿') + (chat.otherUser.status === 'online' ? '<div class="online-dot"></div>' : '') + '</div>';
                            name = chat.otherUser.displayName || chat.otherUser.username || 'Пользователь';
                        }
                        
                        var lastMsg = chat.lastMessage ? (chat.lastMessage.text || (chat.lastMessage.fileUrl ? '📎 Файл' : 'Сообщение')) : 'Нет сообщений';
                        
                        div.innerHTML = avatar + '<div class="chat-info"><div class="chat-name">' + escapeHtml(name) + '</div><div class="chat-last">' + lastMsg + '</div></div><div class="chat-time">' + time + '</div>';
                        div.addEventListener('click', function() {
                            openChat(chat);
                        });
                        container.appendChild(div);
                    });
                });
        }
        
        function openChat(chat) {
            currentChat = chat;
            if (unsubscribeChat) unsubscribeChat();
            showChatScreen(chat);
        }
        
        function showChatScreen(chat) {
            var app = document.getElementById('app');
            var name = '';
            var avatar = '';
            
            if (chat.type === 'group') {
                name = chat.groupName || 'Группа';
                avatar = '<div class="avatar-md group-avatar" style="width:38px;height:38px;font-size:18px;">' + (name[0] || 'Г') + '</div>';
            } else if (chat.otherUser) {
                name = chat.otherUser.displayName || chat.otherUser.username || 'Чат';
                avatar = chat.otherUser.avatar ? '<img src="' + chat.otherUser.avatar + '">' : '🌿';
            }
            
            app.innerHTML = `
                <div id="chatScreen" class="screen">
                    <div class="header">
                        <button class="header-btn" id="chatBackBtn">←</button>
                        <div class="avatar-sm" id="chatAvatar">${avatar}</div>
                        <div class="header-title" id="chatTitle">${escapeHtml(name)}</div>
                    </div>
                    <div class="messages-container" id="messagesContainer"></div>
                    <div class="input-area">
                        <input type="file" id="fileInput" style="display:none" accept="image/*">
                        <button class="attach-btn" id="attachBtn">📎</button>
                        <input type="text" id="messageInput" placeholder="Сообщение..." maxlength="500">
                        <button class="send-btn" id="sendButton">➤</button>
                    </div>
                </div>
            `;
            
            document.getElementById('chatBackBtn').addEventListener('click', function() {
                currentChat = null;
                showChatListScreen();
                loadChats();
            });
            
            document.getElementById('chatAvatar').addEventListener('click', function() {
                if (chat.otherUser) {
                    viewingProfile = chat.otherUser;
                    showProfileScreen();
                }
            });
            
            document.getElementById('sendButton').addEventListener('click', sendMessage);
            document.getElementById('messageInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') sendMessage();
            });
            document.getElementById('attachBtn').addEventListener('click', function() {
                document.getElementById('fileInput').click();
            });
            document.getElementById('fileInput').addEventListener('change', sendFile);
            
            // Загрузить сообщения
            fetch(API + '/api/messages/' + chat.id)
                .then(function(res) { return res.json(); })
                .then(function(msgs) {
                    var cont = document.getElementById('messagesContainer');
                    cont.innerHTML = '';
                    msgs.forEach(function(msg) {
                        addMessageBubble(msg);
                    });
                    cont.scrollTop = cont.scrollHeight;
                });
        }
        
        function addMessageBubble(msg) {
            var cont = document.getElementById('messagesContainer');
            if (!cont) return;
            
            var wrapper = document.createElement('div');
            var isMine = msg.senderId === currentUser.id;
            wrapper.className = 'message-wrapper ' + (isMine ? 'mine' : 'other');
            
            var content = '';
            if (msg.type === 'image' && msg.fileUrl) {
                content = '<img src="' + msg.fileUrl + '" onerror="this.outerHTML=\'🖼️\'">';
            } else if (msg.type === 'voice' && msg.fileUrl) {
                content = '<audio src="' + msg.fileUrl + '" controls></audio>';
            } else {
                content = escapeHtml(msg.text || '');
            }
            
            var time = msg.timestamp ? formatTime(msg.timestamp) : '';
            
            wrapper.innerHTML = '<div class="message-bubble">' + content + '</div><div class="message-time">' + time + '</div>';
            cont.appendChild(wrapper);
            cont.scrollTop = cont.scrollHeight;
        }
        
        function sendMessage() {
            var input = document.getElementById('messageInput');
            var text = input.value.trim();
            if (!text || !currentChat) return;
            
            socket.emit('sendMessage', {
                chatId: currentChat.id,
                senderId: currentUser.id,
                text: text,
                type: 'text',
                isGroup: currentChat.type === 'group',
                receiverId: currentChat.otherUser ? currentChat.otherUser.id : null
            });
            
            input.value = '';
        }
        
        function sendFile(e) {
            var file = e.target.files[0];
            if (!file || !currentChat) return;
            
            var fd = new FormData();
            fd.append('file', file);
            
            fetch(API + '/api/upload', { method: 'POST', body: fd })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.url) {
                        socket.emit('sendMessage', {
                            chatId: currentChat.id,
                            senderId: currentUser.id,
                            text: '',
                            type: 'image',
                            fileUrl: data.url,
                            isGroup: currentChat.type === 'group',
                            receiverId: currentChat.otherUser ? currentChat.otherUser.id : null
                        });
                    }
                });
            
            e.target.value = '';
        }
        
        // ============ CONTACTS ============
        function showContactsScreen() {
            var app = document.getElementById('app');
            app.innerHTML = `
                <div id="contactsScreen" class="screen">
                    <div class="header">
                        <button class="header-btn" id="contactsBackBtn">←</button>
                        <div class="header-title">Контакты</div>

                    </div>

                        <input type="text" id="contactSearchInput" placeholder="🔍 Введите точное имя пользователя...">
                    </div>
                    <div class="chat-list" id="contactsList">
                        <div class="no-contacts">🔍 Введите имя для поиска</div>
                    </div>
                    <div style="padding:8px 16px;">
                        <div style="font-size:12px;color:var(--text-secondary);padding:8px 0 4px;font-weight:600;">История поиска</div>

            document.getElementById('contactsBackBtn').addEventListener('click', function() {

            document.getElementById('createGroupBtn').addEventListener('click', function() {
                alert('Группы скоро');
            });
            
            fetch(API + '/api/users/' + currentUser.id)
                .then(function(res) { return res.json(); })
                .then(function(users) {

                    loadSearchHistory();
                });
            
            document.getElementById('contactSearchInput').addEventListener('input', function(e) {
                var q = e.target.value.trim();

                if (!q) {
                    list.innerHTML = '<div class="no-contacts">🔍 Введите имя для поиска</div>';

                }
                
                var filtered = allUsersCache.filter(function(u) {

                });
                
                if (!filtered.length) {
                    list.innerHTML = '<div class="no-contacts">Не найдено</div>';
                    return;
                }
                
                list.innerHTML = '';
                filtered.forEach(function(user) {

                    div.className = 'contact-item';
                    div.innerHTML = '<div class="avatar-md">' + (user.avatar ? '<img src="' + user.avatar + '">' : '🌿') + '</div><div><div class="contact-name">' + escapeHtml(user.displayName || user.username) + '</div></div>';
                    div.addEventListener('click', function() {
                        addToHistory(user);
                        startChat(user);
                    });
                    list.appendChild(div);
                });
            });
        }
        
        function loadSearchHistory() {
            var container = document.getElementById('searchHistory');
            if (!container) return;
            
            var history = JSON.parse(localStorage.getItem('searchHistory') || '[]');
            if (!history.length) {
                container.innerHTML = '<span style="color:var(--text-secondary);font-size:12px;">Пусто</span>';
                return;
            }
            
            container.innerHTML = history.map(function(h) {
                var av = h.avatar ? '<img src="' + h.avatar + '" style="width:20px;height:20px;border-radius:50%;vertical-align:middle;">' : '🌿';
                return '<span style="display:inline-block;padding:6px 12px;margin:4px;background:var(--app-bg);border:1px solid var(--input-border);border-radius:16px;cursor:pointer;font-size:13px;" onclick="searchFromHistory(\'' + h.username + '\')">' + av + ' ' + h.displayName + '</span>';
            }).join('');
        }
        
        function addToHistory(user) {
            var history = JSON.parse(localStorage.getItem('searchHistory') || '[]');
            history = history.filter(function(h) { return h.id !== user.id; });
            history.unshift({ id: user.id, username: user.username, displayName: user.displayName, avatar: user.avatar });
            history = history.slice(0, 5);
            localStorage.setItem('searchHistory', JSON.stringify(history));
        }
        
        function searchFromHistory(username) {
            var input = document.getElementById('contactSearchInput');
            if (input) {
                input.value = username;
                input.dispatchEvent(new Event('input'));
            }
        }
        
        function startChat(user) {
            var chatId = [currentUser.id, user.id].sort().join('-');
            currentChat = { id: chatId, type: 'private', otherUser: user };
            showChatScreen(currentChat);
        }

                if (socket) socket.disconnect();
                localStorage.removeItem('brolife_user');
                currentUser = null;
                currentChat = null;
                showAuthScreen();
            });
        }
        
        // ============ STARTUP ============
        var saved = localStorage.getItem('brolife_user');
        if (saved) {
            try {
                currentUser = JSON.parse(saved);
                connectSocket();
                showChatListScreen();
                loadChats();
            } catch(e) {
                showAuthScreen();
            }
        } else {
            showAuthScreen();
        }
    </script>
</body>
</html>
